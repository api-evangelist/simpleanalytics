name: Simple Analytics
kind: company
description: Simple Analytics is a privacy-first, cookieless web analytics platform
  built and hosted in the European Union by Simple Analytics B.V. in the Netherlands.
  It collects no personal data, sets no cookies, stores no IP addresses and needs no
  consent banner, while exposing a REST API surface to pull aggregated dashboard
  statistics, export raw unsampled data points (page views and events) to warehouses
  and BI tools, collect custom events server-side from backends and mobile apps, and
  administer the websites in an account. Public websites can be read anonymously on
  both read APIs, and a large first-party plugin library installs the tracking script
  across common frameworks and CMSes.
