description: >-
  Which cross-cutting standards the Simple Analytics API surface conforms to.
  The provider's compliance posture is regulatory (EU privacy law) rather than
  technical: GDPR/ePrivacy conformance is the product thesis and is documented
  in depth, while API-level standards conformance is thin — no OAuth, no OIDC,
  no RFC 9457, no pagination or idempotency convention.
standards:
- id: gdpr
  conforms: true
  evidence: >-
    Dedicated GDPR compliance page plus docs/compliance; no personal data
    collected, no cookies, IP addresses discarded on ingest, all processing in
    the Netherlands. Published at https://www.simpleanalytics.com/gdpr-compliance
- id: eprivacy-directive
  conforms: true
  evidence: >-
    Pricing FAQ states the product satisfies the ePrivacy Directive, UK GDPR and
    PECR because it processes only non-personal data.
- id: dpa-available
  conforms: true
  evidence: https://www.simpleanalytics.com/data-processing-agreement
- id: subprocessor-disclosure
  conforms: true
  evidence: >-
    Named subprocessor list published at
