description: >-
  Versioning, deprecation and operational-transparency posture for the Simple
  Analytics APIs. Versioning is explicit and well behaved — six numbered
  versions, all still answering — but there is no published deprecation policy,
  no Sunset/Deprecation header support, and no SLA outside Enterprise contracts.
versioning:
  scheme: query-parameter
  parameter: version
  current: '6'
  supported:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  docs: https://docs.simpleanalytics.com/api/stats
  evidence: >-
    A live Stats API response on 2026-08-13 states: "You are using the latest
    version. You can specify versions by adding 'version=6' to your URL (valid
    versions: 1, 2, 3, 4, 5, 6)".
  note: >-
    Version 6 added the `hour` histogram interval and metadata.<key> filtering.
    Older versions have not been withdrawn.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation or sunset policy is published anywhere in the docs sitemap,
    and no RFC 8594 Sunset or Deprecation header was observed on live responses.
    The one documented deprecation-shaped change is a field rename in the Export
    API, handled by keeping the old name forever rather than by policy.
  field_renames:
  - from: session_id
    to: page_load_id
    status: >-
      session_id remains available in exports for backward compatibility; the
      docs say existing exports, queries and integrations will not break.
    docs: https://docs.simpleanalytics.com/api/export-data-points
